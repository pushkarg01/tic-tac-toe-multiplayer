services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Optional overrides here if you want, but env_file already provides these
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - tic-tac-toe-network

  app:
    # Build the repository and use the builder stage so dev deps are available
    build:
      context: .
      target: builder
    image: tic-tac-toe-multiplayer-backend:latest
    working_dir: /usr/src/app
    stdin_open: true
    tty: true
    env_file:
      - .env
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      FORCE_COLOR: 1
      NPM_CONFIG_COLOR: always
    # Mount project source into container so edits reflect immediately (hot-reload)
    volumes:
      - ./:/usr/src/app:cached
      # Keep node_modules in container so host doesn't overwrite them
      - node_modules:/usr/src/app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tic-tac-toe-network
    command: sh -c "npm ci && npx prisma migrate deploy && npm run start:dev"
    # Optional: uncomment if you want to open a shell instead of running the app
    # command: sh -c "npm ci && bash"

volumes:
  pgdata:
  node_modules:

networks:
  tic-tac-toe-network:
    driver: bridge
